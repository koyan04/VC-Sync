name: Build Inno Setup Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'installer/VC-Sync-Setup.iss'
      - 'VCSyncBackupApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Build Release
      run: dotnet publish .\VCSyncBackupApp\VCSyncBackupApp.csproj -c Release -r win-x64 --self-contained false -o .\publish\win-x64
    
    - name: Install Inno Setup
      run: choco install innosetup -y
    
    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) {
          $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
        }
        & $iscc ".\installer\VC-Sync-Setup.iss"
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VC-Sync-Installer
        path: installer/dist/VC-Sync-Setup-*.exe
